apiVersion: 1

providers:
  - name: 'Restaurant Monitoring'
    orgId: 1
    folder: 'Restaurant Monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
